name: Deploy ScaleOps to GitHub Pages

on:
  # Начинает развертывание при каждом push в ветку main
  push:
    branches: ["main"]

  # Позволяет запускать этот workflow вручную из вкладки Actions
  workflow_dispatch:

# Устанавливаем разрешения токена для возможности развертывания
permissions:
  contents: read
  pages: write
  id-token: write

# Разрешает только одно параллельное развертывание
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Единая работа для сборки и деплоя
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './elevate-bpo/package-lock.json'
      
      - name: Install dependencies
        run: npm ci
        working-directory: ./elevate-bpo
      
      - name: Build project
        run: npm run build
        working-directory: ./elevate-bpo
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Загружаем собранную папку dist из подпапки
          path: './elevate-bpo/dist'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
